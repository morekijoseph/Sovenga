<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="View our delicious bakery creations — breads, pastries, and cakes from Sovenga Bakery." />
  <title>Sovenga Bakery | Gallery</title>
  <link rel="stylesheet" href="stylesheet.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <h1>Sovenga Bakery</h1>
        <div id="current-date" class="date"></div>
      </div>
      <button id="nav-toggle" aria-expanded="false" aria-controls="main-nav" class="nav-toggle">☰ Menu</button>
      <nav id="main-nav" class="main-nav" aria-label="Main navigation" aria-hidden="true">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="gallery.html" class="active">Gallery</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <h2>Gallery</h2>
      <div class="gallery-grid">
        <img src="banana.jfif" alt="Banana bread" class="gallery-img" />
        <img src="white-bread-.webp" alt="White bread" class="gallery-img" />
        <img src="chocolate muffins.jfif" alt="Chocolate muffins" class="gallery-img" />
        <img src="vanila.jfif" alt="Vanilla muffins" class="gallery-img" />
        <img src="custom cake.jpg" alt="Custom cake" class="gallery-img" />
        <img src="sweet pastries.jfif" alt="Sweet pastries" class="gallery-img" />
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <p>&copy; <span id="year"></span> Sovenga Bakery. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
